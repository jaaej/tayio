# Dependabot config — auto-PRs for npm dependency security patches.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Cap concurrent open PRs so we don't drown in noise. Security alerts
    # (separate from version updates) are uncapped — they always come through.
    open-pull-requests-limit: 5
    # Group patch + minor updates of related packages into single PRs.
    # Major bumps stay as individual PRs so they can be reviewed carefully.
    groups:
      next-stack:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "patch"
          - "minor"
      supabase:
        patterns:
          - "@supabase/*"
        update-types:
          - "patch"
          - "minor"
      drizzle:
        patterns:
          - "drizzle-*"
          - "postgres"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
